<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Philosophy Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: stock-ticker band on top, sticker-style lecture cards below, one flip card per question. */
:root {
  --bg: #EDEFF7;
  --surface: #FFFFFF;
  --surface-2: #E1E5F2;
  --ink: #15162C;
  --muted: #565B78;
  --line: #CDD2E4;
  --accent: #F2346F;
  --accent-ink: #FFFFFF;
  --electric: #3653F5;
  --sticker: #FFD23F;
  --sticker-ink: #15162C;
  --good: #0B8F52;
  --good-soft: #D9F3E6;
  --bad: #D92F3E;
  --bad-soft: #FCE1E4;
  --warn: #B87500;
  --warn-soft: #FFF0C9;
  --shadow: #15162C;
  --font-display: "Bricolage Grotesque", "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2.125rem;
  --step-4: clamp(2.5rem, 7vw, 4.5rem);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0E1C; --surface: #171931; --surface-2: #21243F; --ink: #EEF0FF; --muted: #A3A8C9; --line: #2E3254;
    --accent: #FF5A92; --accent-ink: #12131F; --electric: #8297FF; --sticker: #FFD23F; --sticker-ink: #15162C;
    --good: #3FD68E; --good-soft: #10301F; --bad: #FF6B78; --bad-soft: #3A1620; --warn: #FFC94D; --warn-soft: #33290F;
    --shadow: #000000; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0E1C; --surface: #171931; --surface-2: #21243F; --ink: #EEF0FF; --muted: #A3A8C9; --line: #2E3254;
  --accent: #FF5A92; --accent-ink: #12131F; --electric: #8297FF; --sticker: #FFD23F; --sticker-ink: #15162C;
  --good: #3FD68E; --good-soft: #10301F; --bad: #FF6B78; --bad-soft: #3A1620; --warn: #FFC94D; --warn-soft: #33290F;
  --shadow: #000000; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
  min-height: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink);
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--electric); outline-offset: 2px; }

.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ticker */
.ticker {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--ink); color: var(--bg);
  font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase;
  overflow: hidden; white-space: nowrap; border-bottom: 2px solid var(--ink);
}
.ticker-track { display: inline-flex; gap: 2.5rem; padding-block: 8px; animation: tick 60s linear infinite; padding-left: 1rem; }
.ticker-track span { display: inline-flex; gap: 0.5rem; align-items: center; }
.ticker .up { color: var(--good); }
.ticker .down { color: var(--bad); }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 44px; padding: 0 1.1rem; border-radius: 999px; cursor: pointer;
  border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
  font-weight: 700; box-shadow: 3px 3px 0 var(--shadow);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { box-shadow: none; border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); transform: none; }

/* toggles */
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px 0 10px;
  border-radius: 999px; border: 2px solid var(--line); background: var(--surface); cursor: pointer;
  font-weight: 600; font-size: var(--step--1);
}
.toggle .dot { width: 26px; height: 16px; border-radius: 99px; background: var(--surface-2); position: relative; transition: background .15s; border: 1.5px solid var(--line); }
.toggle .dot::after { content: ""; position: absolute; top: 1px; left: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.toggle[aria-pressed="true"] { border-color: var(--ink); }
.toggle[aria-pressed="true"] .dot { background: var(--good); border-color: var(--good); }
.toggle[aria-pressed="true"] .dot::after { transform: translateX(10px); background: #fff; }

/* hero */
.hero { padding-block: 40px 28px; display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.hero h1 { font-size: var(--step-4); font-weight: 800; max-width: 16ch; }
.hero h1 .strike { position: relative; white-space: nowrap; }
.hero h1 .strike::after { content: ""; position: absolute; left: -2%; right: -2%; top: 52%; height: 0.12em; background: var(--accent); transform: rotate(-3deg); border-radius: 4px; }
.hero .tag { font-size: var(--step-1); max-width: 56ch; color: var(--muted); }
.hero .tag b { color: var(--ink); }
.sticker {
  display: inline-block; background: var(--sticker); color: var(--sticker-ink); font-family: var(--font-display); font-weight: 800;
  padding: 4px 12px; border: 2px solid var(--ink); border-radius: 10px; transform: rotate(-3deg); box-shadow: 3px 3px 0 var(--shadow);
  font-size: var(--step--1); letter-spacing: 0.02em;
}
.hero-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }

/* stats strip */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 2px solid var(--ink); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.stat { padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.stat + .stat { border-left: 2px solid var(--line); }
.stat .k { font-family: var(--font-mono); font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-weight: 800; font-size: var(--step-2); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .v.small { font-size: var(--step-0); line-height: 1.25; padding-top: 4px; }
.stats-empty { grid-column: 1 / -1; padding: 14px 16px; color: var(--muted); }
@media (max-width: 680px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 2px solid var(--line); }
}

/* lecture grid */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 34px 14px; }
.section-head h2 { font-size: var(--step-2); }
.section-head p { color: var(--muted); font-size: var(--step--1); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; padding-bottom: 24px; }
.home-toggles { padding-bottom: 28px; }
.made-by { text-align: center; font-weight: 600; border-top: 2px dashed var(--line); padding-top: 20px; }
.lec {
  text-align: left; cursor: pointer; display: grid; gap: 12px; align-content: start;
  background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius); padding: 18px;
  box-shadow: 5px 5px 0 var(--shadow); transition: transform .14s ease, box-shadow .14s ease; min-width: 0;
}
.lec:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--shadow); }
.lec:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--shadow); }
.lec-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.code { font-family: var(--font-mono); font-weight: 700; font-size: 0.8125rem; background: var(--ink); color: var(--bg); padding: 4px 10px; border-radius: 8px; letter-spacing: 0.06em; }
.best { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.best b { color: var(--ink); }
.lec h3 { font-size: var(--step-2); font-weight: 800; }
.lec .sub { color: var(--muted); font-size: var(--step--1); }
.lec .quip { font-weight: 600; font-size: var(--step--1); border-top: 2px dashed var(--line); padding-top: 10px; }
.lec .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font-family: var(--font-mono); font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; border: 1.5px solid var(--line); color: var(--muted); }
.pill.trap { border-color: var(--accent); color: var(--accent); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
.lec.boss { grid-column: 1 / -1; background: var(--ink); color: var(--bg); border-color: var(--ink); grid-template-columns: 1fr; }
.lec.boss .sub, .lec.boss .best { color: color-mix(in srgb, var(--bg) 70%, var(--ink)); }
.lec.boss .best b { color: var(--bg); }
.lec.boss .code { background: var(--accent); color: var(--accent-ink); }
.lec.boss h3 { font-size: var(--step-3); }
.boss-cta { justify-self: start; font-family: var(--font-display); font-weight: 800; font-size: var(--step-1); background: var(--sticker); color: var(--sticker-ink); padding: 10px 16px; border-radius: 12px; transform: rotate(2deg); border: 2px solid var(--bg); }
@media (max-width: 600px) { .lec.boss { grid-template-columns: 1fr; } .boss-cta { justify-self: start; } }

footer { color: var(--muted); font-size: var(--step--1); padding-block: 0 48px; }

/* setup sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--ink) 55%, transparent); display: grid; place-items: end center; }
@media (min-width: 640px) { .scrim { place-items: center; } }
.sheet {
  width: min(560px, 100%); background: var(--surface); border: 2px solid var(--ink); border-radius: 20px 20px 0 0;
  padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: grid; gap: 16px; box-shadow: 0 -6px 0 var(--shadow); animation: up .22s ease-out;
}
@media (min-width: 640px) { .sheet { border-radius: 20px; box-shadow: 8px 8px 0 var(--shadow); padding: 26px; } }
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet h2 { font-size: var(--step-3); }
.sheet .sub { color: var(--muted); }
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 12px; }
.count {
  cursor: pointer; border: 2px solid var(--ink); border-radius: var(--radius); background: var(--surface); padding: 16px 8px; display: grid; gap: 4px; justify-items: center;
  box-shadow: 4px 4px 0 var(--shadow); transition: transform .12s, box-shadow .12s, background .12s;
}
.count:hover { background: var(--sticker); color: var(--sticker-ink); transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--shadow); }
.count:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--shadow); }
.count b { font-family: var(--font-display); font-size: var(--step-3); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.count span { font-size: 0.75rem; font-weight: 600; text-align: center; }
.mistake-btn { justify-self: stretch; }
.sheet-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted); letter-spacing: 0.04em; }

/* quiz */
.quiz { padding-block: 18px 64px; display: grid; gap: 16px; max-width: 760px; margin: 0 auto; }
.qbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.qbar .grow { flex: 1 1 160px; display: grid; gap: 6px; min-width: 0; }
.qbar .count-line { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 10px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: var(--surface); }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.chips { display: flex; gap: 8px; }
.chip { font-family: var(--font-mono); font-weight: 700; font-size: 0.8125rem; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--ink); background: var(--surface); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.fire { background: var(--sticker); color: var(--sticker-ink); }
.chip.fire.hot { animation: pulse .5s ease; }
@keyframes pulse { 50% { transform: scale(1.18) rotate(-4deg); } }
.quit { min-height: 40px; padding: 0 12px; font-size: var(--step--1); }

.flip { display: grid; perspective: 1600px; }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 2px solid var(--ink); border-radius: 20px; box-shadow: 6px 6px 0 var(--shadow);
  padding: clamp(18px, 4vw, 30px); display: grid; gap: 18px; align-content: start;
  transition: transform .6s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; min-width: 0;
}
.back { transform: rotateY(180deg); pointer-events: none; }
.flipped .front { transform: rotateY(-180deg); pointer-events: none; }
.flipped .back { transform: rotateY(0); pointer-events: auto; }
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tagchip { font-family: var(--font-mono); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 9px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
.trapchip { font-family: var(--font-mono); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 9px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.qtext { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.25rem, 3.6vw, 1.75rem); line-height: 1.2; text-wrap: pretty; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; cursor: pointer;
  border: 2px solid var(--ink); border-radius: 12px; background: var(--surface); padding: 12px 14px; min-height: 52px; font-weight: 600;
  transition: transform .1s, background .12s, box-shadow .12s; box-shadow: 3px 3px 0 var(--shadow);
}
.opt:hover:not(:disabled) { background: var(--surface-2); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow); }
.opt:disabled { cursor: default; }
.opt .key { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 0.8125rem; font-weight: 700; }
.opt.is-right { background: var(--good-soft); border-color: var(--good); }
.opt.is-right .key { background: var(--good); color: #fff; }
.opt.is-wrong { background: var(--bad-soft); border-color: var(--bad); animation: shake .4s ease; }
.opt.is-wrong .key { background: var(--bad); color: #fff; }
.opt.dim { opacity: .55; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.verdict { display: grid; gap: 6px; }
.verdict .big { font-family: var(--font-display); font-weight: 800; font-size: var(--step-3); line-height: 1; }
.verdict.ok .big { color: var(--good); }
.verdict.no .big { color: var(--bad); }
.verdict .line { color: var(--muted); font-weight: 600; }
.answer-box { border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; background: var(--good-soft); border: 2px solid var(--good); }
.answer-box.yours { background: var(--bad-soft); border-color: var(--bad); }
.answer-box .k { font-family: var(--font-mono); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.answer-box .v { font-weight: 700; }
.explain { font-size: var(--step-0); line-height: 1.6; max-width: 65ch; }
.explain::before { content: "Why: "; font-weight: 700; }
.back-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.kbd-hint { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted); text-align: center; }
@media (hover: none) { .kbd-hint { display: none; } }

/* meme reaction, shown inside the answer card */
.verdict-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
#b-meme:empty { display: none; }
.meme { margin: 0; width: clamp(104px, 28vw, 168px); display: grid; gap: 6px; justify-items: center; transform: rotate(2deg); animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.meme img { display: block; width: 100%; height: auto; max-height: 150px; object-fit: contain; border-radius: 10px; border: 2px solid var(--ink); background: var(--surface-2); }
.meme figcaption { font-family: var(--font-display); font-weight: 800; font-size: 0.8125rem; line-height: 1.15; text-align: center; text-wrap: balance; }
.meme.bad figcaption { color: var(--bad); }
.meme.good figcaption { color: var(--good); }
@keyframes pop { from { transform: scale(.6) rotate(-8deg); opacity: 0; } to { transform: rotate(2deg); opacity: 1; } }

/* results */
.results { padding-block: 26px 72px; display: grid; gap: 18px; }
.res-hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
@media (max-width: 760px) { .res-hero { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h3 { font-size: var(--step-1); font-weight: 800; }
.panel .lead { color: var(--muted); font-size: var(--step--1); }
.scoreline { font-family: var(--font-display); font-weight: 800; font-size: var(--step-4); line-height: .95; font-variant-numeric: tabular-nums; }
.scoreline small { font-size: 0.4em; color: var(--muted); font-weight: 700; }
.grade { font-family: var(--font-display); font-weight: 800; font-size: var(--step-2); }
.res-gif { border-radius: 12px; width: 100%; height: auto; max-height: 320px; object-fit: contain; align-self: center; border: 2px solid var(--ink); background: var(--surface-2); }
.gauge { display: grid; gap: 6px; }
.gauge-track { position: relative; height: 14px; border-radius: 99px; background: linear-gradient(90deg, var(--bad) 0 50%, var(--warn) 50% 75%, var(--good) 75% 100%); border: 2px solid var(--ink); }
.gauge-mark { position: absolute; top: -7px; width: 6px; height: 24px; background: var(--ink); border-radius: 3px; transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.gauge-labels { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted); }
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 18px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.kpi .k { font-family: var(--font-mono); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.kpi .v { font-family: var(--font-display); font-weight: 800; font-size: var(--step-2); font-variant-numeric: tabular-nums; }
.topic-list { display: grid; gap: 10px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 56px; gap: 4px 10px; align-items: center; }
.trow .name { font-weight: 600; font-size: var(--step--1); overflow-wrap: anywhere; }
.trow .num { font-family: var(--font-mono); font-size: 0.75rem; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; grid-row: span 2; align-self: center; }
.trow .bar > i.mid { background: var(--warn); }
.trow .bar > i.low { background: var(--bad); }
.advice { display: grid; gap: 10px; }
.advice p { padding-left: 14px; border-left: 3px solid var(--accent); }
.miss-list { display: grid; gap: 10px; }
.miss { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.miss summary { cursor: pointer; font-weight: 700; list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.miss summary::-webkit-details-marker { display: none; }
.miss summary .x { color: var(--bad); font-family: var(--font-mono); }
.miss .body { display: grid; gap: 6px; padding-top: 10px; font-size: var(--step--1); }
.miss .body .r { color: var(--good); font-weight: 700; }
.miss .body .w { color: var(--bad); font-weight: 600; text-decoration: line-through; }
.res-actions { display: flex; gap: 10px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  .ticker-track { animation: none; }
  .face, .lec, .btn, .count, .opt { transition: none; }
  .opt.is-wrong, .meme, .sheet, .chip.fire.hot { animation: none; }
}
</style>

<div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

<main>
  <!-- HOME -->
  <section id="home" class="wrap">
    <div class="hero">
      <span class="eyebrow">Questions for</span>
      <h1>History of Philosophy</h1>
    </div>
    <div class="grid" id="grid"></div>
    <div class="toggles home-toggles" role="group" aria-label="Settings">
      <button class="toggle" id="t-memes" aria-pressed="true"><span class="dot"></span>Memes</button>
      <button class="toggle" id="t-sfx" aria-pressed="true"><span class="dot"></span>Sound</button>
    </div>
    <footer class="made-by">Made by Shohboz by Love and Claude</footer>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="wrap" hidden>
    <div class="quiz">
      <div class="qbar">
        <button class="btn ghost quit" id="quit">✕ Quit</button>
        <div class="grow">
          <div class="count-line"><span id="q-lec"></span><span id="q-count"></span></div>
          <div class="progress"><i id="q-prog"></i></div>
        </div>
        <div class="chips">
          <span class="chip" id="q-score" title="Correct answers">✓ 0</span>
          <span class="chip fire" id="q-streak" title="Current streak">🔥 0</span>
        </div>
      </div>
      <div class="flip" id="flip">
        <article class="face front" id="front" aria-live="polite">
          <div class="qmeta" id="q-meta"></div>
          <p class="qtext" id="q-text"></p>
          <div class="opts" id="q-opts"></div>
          <p class="kbd-hint">Keys 1–4 to answer · Enter for next</p>
        </article>
        <article class="face back" id="back" aria-live="polite">
          <div class="verdict-row"><div class="verdict" id="b-verdict"></div><div id="b-meme"></div></div>
          <div id="b-answers" style="display:grid;gap:10px"></div>
          <div class="back-actions">
            <button class="btn ghost" id="b-peek">↺ See question</button>
            <button class="btn primary" id="b-next">Next card →</button>
          </div>
        </article>
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="wrap" hidden>
    <div class="results" id="res"></div>
  </section>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title">
    <div class="hint" id="s-code"></div>
    <h2 id="s-title"></h2>
    <p class="sub" id="s-sub"></p>
    <div>
      <p style="font-weight:700;margin-bottom:10px">How many cards are you brave enough for?</p>
      <div class="counts" id="s-counts"></div>
    </div>
    <button class="btn mistake-btn" id="s-mistakes" hidden></button>
    <div class="sheet-foot">
      <span class="hint">Tap a number to start</span>
      <button class="btn ghost" id="s-close">Not today</button>
    </div>
  </div>
</div>


<script src="questions.js"></script>
<script>
(function () {
  "use strict";
  const LECS = window.LECTURES || [];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const pct = (c, n) => (n ? Math.round((c / n) * 100) : 0);

  // ---------- question index ----------
  const ALL = [];
  LECS.forEach((L) => L.qs.forEach((q, i) => { q.id = L.id + "-" + i; q.lec = L; ALL.push(q); }));
  const BOSS = { id: 0, code: "ALL", title: "Final Boss", sub: "Every theme mixed into one deck. This is the closest thing to the real exam.", quip: "", qs: ALL };
  const lecById = (id) => (id === 0 ? BOSS : LECS.find((L) => L.id === id));

  // ---------- storage (per-browser only) ----------
  const KEY = "comparative-disadvantage-v1";
  const blank = () => ({ settings: { memes: true, sfx: true }, lec: {}, total: { n: 0, c: 0 }, bestStreak: 0, topics: {} });
  let S = blank();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const lecStat = (id) => (S.lec[id] = S.lec[id] || { rounds: 0, best: null, missed: [] });

  // ---------- memes ----------
  const M = (f, cap, say) => ({ src: "memes/" + f + ".gif", cap, say: say || cap });
  const MEMES = {
    wrong: [
      M("this-is-fine", "This is fine. (It is not fine.)", "This is fine."),
      M("crying-cat", "Me reading the slide I skipped", "Crying in economics."),
      M("crying-cat-thumbs", "It's okay. It's not okay.", "It's okay. It's not okay."),
      M("bruh", "Bruh.", "Bruh."),
      M("bruh-mike", "BRUH", "Bruh moment."),
      M("surprised-pikachu", "Surprised? The slide literally said it.", "Surprised? The slide literally said it."),
      M("math-lady-confused", "Me explaining apeiron at 3am", "Calculating. Calculating. Wrong."),
      M("michael-scott-no-god-no", "No. God. Please. No.", "No! God! Please no!"),
      M("facepalm", "The professor grading that answer", "Facepalm."),
      M("travolta-confused", "Looking for the right answer like…", "Where did the right answer go?"),
      M("homer-bushes", "Me slowly backing out of the lecture hall", "I'll just leave."),
      M("disappointed-cricket-fan", "Your professor, right now", "Disappointed, but not surprised."),
      M("spongebob-panic", "Exam week in one GIF", "Panic mode activated."),
      M("sad-hamster", "*sad hamster violin plays*", "Sad violin noises."),
      M("side-eye-monkey", "You really picked that?", "You really picked that?"),
      M("kermit-falling-apart", "My GPA leaving the chat", "GPA has left the chat."),
      M("wrong-buzzer", "[EXTREMELY LOUD INCORRECT BUZZER]", "Extremely loud incorrect buzzer."),
      M("nope-nope-nope", "Nope.", "Nope. Nope. Nope."),
      M("idiot-sandwich", "What are you?", "What are you? An idiot sandwich."),
      M("visible-confusion", "*visible confusion*", "Visible confusion."),
      M("you-tried", "You tried. That's the whole tweet.", "You tried."),
      M("rock-eyebrow", "That answer is kinda sus", "That answer is kinda sus."),
      M("kombucha-girl", "Hmm… no.", "Hmm. No.")
    ],
    heavy: [
      M("emotional-damage", "EMOTIONAL DAMAGE", "Emotional damage!"),
      M("coffin-dance", "Your grade has left the building", "Rest in peace, your grade."),
      M("skull-laugh", "The professor reading your midterm", "Myahahaha!"),
      M("banana-cat", "Three in a row. Banana cat is crying for you.", "Three wrong in a row. Banana cat is crying."),
      M("homer-im-out", "Very well… I am out.", "Very well. I am out.")
    ],
    right: [
      M("success-kid", "Small win. Big energy.", "Small win. Big energy."),
      M("leonardo-dicaprio-cheers", "Cheers to you, philosopher", "Cheers to you."),
      M("stonks", "STONKS", "Stonks!"),
      M("sheesh", "SHEEEESH", "Sheeeesh!"),
      M("roll-safe", "Can't fail the exam if you know the cheat sheet", "Can't fail if you know the cheat sheet."),
      M("big-brain", "Galaxy brain unlocked", "Galaxy brain."),
      M("nailed-it", "Nailed it.", "Nailed it."),
      M("cat-vibing", "Vibing with the Dao", "Vibing."),
      M("let-him-cook", "Let them cook", "Let them cook!"),
      M("mind-blown", "Mind = blown", "Mind blown."),
      M("spongebob-imagination", "Imagine failing. Couldn't be you.", "Imagine failing. Couldn't be you.")
    ],
    streak: [
      M("gigachad", "Gigachad of philosophy", "Gigachad of philosophy."),
      M("obama-medal", "Awarding yourself a medal (deserved)", "Give yourself a medal."),
      M("wolf-of-wall-street", "LET'S GOOOO", "Let's goooo!"),
      M("money-rain", "Love of wisdom: confirmed", "Love of wisdom, confirmed!")
    ]
  };
  const queues = {};
  const nextMeme = (kind) => { if (!queues[kind] || !queues[kind].length) queues[kind] = shuffle(MEMES[kind]); return queues[kind].pop(); };
  const preload = () => ["wrong", "right", "heavy", "streak"].forEach((k) => MEMES[k].slice(0, 4).forEach((m) => { const im = new Image(); im.src = m.src; }));

  // ---------- copy ----------
  const TICKER = [
    ["LOVE OF WISDOM", "▲ PHILEO + SOPHIA", "up"], ["YOUR SLEEP", "▼ NON-BEING", "down"], ["PARMENIDES", "BEING IS MOTIONLESS (LIKE YOU)", ""],
    ["HERACLITUS", "EVERYTHING FLOWS ▲", "up"], ["THALES", "IT'S ALL WATER", ""], ["YOUR GPA", "▼ APEIRON-LEVEL CHAOS", "down"],
    ["SOCRATES", "LACK OF KNOWLEDGE = IGNORANCE", "down"], ["NAQSHBAND", "HEART WITH GOD, HANDS AT WORK", "up"], ["ULUGBEK", "1118 STARS ▲", "up"],
    ["DESCARTES", "THINKING + EXTENDED", ""], ["BRUNO", "STARS ARE SUNS ▲", "up"], ["EXAM", "LOADING…", "down"]
  ];
  const RIGHT_LINES = ["Correct. Respect.", "W answer.", "Locked in.", "Ate. No crumbs.", "That's the one.", "Slay, economically.", "Big brain move."];
  const WRONG_LINES = ["Wrong. It's okay, we move.", "L answer. Read the why.", "Not quite, bestie.", "Big oof.", "The cheat sheet said otherwise.", "Professor 1, you 0."];

  // ---------- audio ----------
  let AC = null;
  const ctx = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === "suspended") AC.resume(); return AC; };
  function tone(freq, start, dur, type, gain, slideTo) {
    const a = ctx(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, a.currentTime + start);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + start + dur);
    g.gain.setValueAtTime(0.0001, a.currentTime + start);
    g.gain.exponentialRampToValueAtTime(gain, a.currentTime + start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + start + dur);
    o.connect(g).connect(a.destination); o.start(a.currentTime + start); o.stop(a.currentTime + start + dur + 0.05);
  }
  const SFX = {
    right() { tone(880, 0, 0.12, "sine", 0.25); tone(1318, 0.09, 0.22, "sine", 0.22); },
    wrong() { tone(140, 0, 0.35, "sawtooth", 0.18); tone(110, 0.05, 0.35, "square", 0.08); },
    boom() { tone(120, 0, 0.9, "sine", 0.6, 38); tone(60, 0, 0.9, "triangle", 0.35, 30); },
    streak() { [523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.07, 0.18, "triangle", 0.2)); },
    fanfare() { [523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.11, 0.22, "square", 0.08)); }
  };
  const sfx = (k) => { if (S.settings.sfx) try { SFX[k](); } catch (e) {} };

  // ---------- meme popup ----------
  function showMeme(m, tone) {
    if (!S.settings.memes) return hideMeme();
    $("b-meme").innerHTML = '<figure class="meme ' + tone + '"><img alt="' + esc(m.cap) + '" src="' + m.src + '"><figcaption>' + esc(m.cap) + "</figcaption></figure>";
  }
  function hideMeme() { $("b-meme").innerHTML = ""; }

  // ---------- views ----------
  function show(view) {
    ["home", "quiz", "results"].forEach((v) => { $(v).hidden = v !== view; });
    window.scrollTo(0, 0);
  }

  function renderTicker() {
    const items = TICKER.map(([a, b, cls]) => "<span>" + esc(a) + ' <b class="' + cls + '">' + esc(b) + "</b></span>").join("");
    $("ticker").innerHTML = items + items;
  }

  function renderGrid() {
    const g = $("grid");
    const card = (L) => {
      const st = S.lec[L.id] || {};
      const best = st.best == null ? "" : '<span class="best">best <b>' + st.best + "%</b></span>";
      if (L.id === 0) return '<button class="lec boss" data-id="0"><div class="lec-top" style="justify-content:flex-start"><span class="code">ALL 7</span>' + best + '</div><h3>Final Boss</h3><span class="boss-cta">All lectures mixed</span></button>';
      return '<button class="lec" data-id="' + L.id + '"><div class="lec-top"><span class="code">' + L.code + "</span>" + best + "</div><h3>" + esc(L.title) + "</h3></button>";
    };
    g.innerHTML = LECS.map(card).join("") + card(BOSS);
    g.querySelectorAll(".lec").forEach((b) => b.addEventListener("click", () => openSetup(+b.dataset.id)));
  }

  function renderToggles() {
    [["t-memes", "memes"], ["t-sfx", "sfx"]].forEach(([id, k]) => {
      const b = $(id);
      b.setAttribute("aria-pressed", String(!!S.settings[k]));
      b.onclick = () => { S.settings[k] = !S.settings[k]; save(); renderToggles(); if (k === "sfx" && S.settings.sfx) sfx("right"); };
    });
  }

  // ---------- setup sheet ----------
  let setupId = null;
  const COUNT_LABELS = { 20: "Quick warm-up", 40: "Serious grind", 60: "Exam simulator" };
  const countsFor = (pool) => [20, 40, 60].filter((n) => n < pool).concat(pool);
  function openSetup(id) {
    ctx();
    setupId = id;
    const L = lecById(id);
    $("s-code").textContent = id === 0 ? "ALL THEMES" : L.code + " · THEME " + L.id;
    $("s-title").textContent = L.title;
    $("s-sub").textContent = L.sub;
    $("s-counts").innerHTML = countsFor(L.qs.length).map((n) => '<button class="count" data-n="' + n + '"><b>' + n + "</b><span>" + (COUNT_LABELS[n] || "Every card") + "</span></button>").join("");
    $("s-counts").querySelectorAll(".count").forEach((b) => b.addEventListener("click", () => startRound(id, +b.dataset.n, false)));
    const missed = missedFor(id);
    const mb = $("s-mistakes");
    mb.hidden = !missed.length;
    mb.textContent = "Retry only my mistakes (" + missed.length + ")";
    mb.onclick = () => startRound(id, missed.length, true);
    $("scrim").hidden = false;
    setTimeout(() => { const f = $("s-counts").querySelector("button"); if (f) f.focus(); }, 30);
  }
  function closeSetup() { $("scrim").hidden = true; }
  function missedFor(id) {
    if (id === 0) return LECS.flatMap((L) => (S.lec[L.id] && S.lec[L.id].missed) || []);
    return (S.lec[id] && S.lec[id].missed) || [];
  }
  $("s-close").addEventListener("click", closeSetup);
  $("scrim").addEventListener("click", (e) => { if (e.target === $("scrim")) closeSetup(); });

  // ---------- round ----------
  let R = null;
  function buildItem(q) {
    if (q.tf !== undefined) return { q, opts: ["True", "False"], ans: q.tf ? 0 : 1, picked: null, ms: 0 };
    const opts = shuffle([q.a].concat(q.w));
    return { q, opts, ans: opts.indexOf(q.a), picked: null, ms: 0 };
  }
  function startRound(id, n, mistakesOnly) {
    closeSetup();
    const L = lecById(id);
    let pool = L.qs;
    if (mistakesOnly) { const ids = new Set(missedFor(id)); pool = ALL.filter((q) => ids.has(q.id)); }
    const qs = shuffle(pool).slice(0, Math.min(n, pool.length));
    R = { id, L, mistakesOnly, items: qs.map(buildItem), i: 0, streak: 0, best: 0, wrongRun: 0, score: 0, t0: 0, locked: false };
    preload();
    $("q-lec").textContent = (id === 0 ? "FINAL BOSS" : L.code + " · " + L.title.toUpperCase()) + (mistakesOnly ? " · MISTAKES" : "");
    $("quit").textContent = "✕ Quit";
    $("quit").dataset.armed = "";
    show("quiz");
    renderCard();
  }

  function renderCard() {
    const it = R.items[R.i];
    const q = it.q;
    $("flip").classList.remove("flipped");
    hideMeme();
    R.locked = false;
    $("q-count").textContent = "Card " + (R.i + 1) + " / " + R.items.length;
    $("q-prog").style.width = (R.i / R.items.length) * 100 + "%";
    $("q-score").textContent = "✓ " + R.score;
    $("q-streak").textContent = "🔥 " + R.streak;
    const lecTag = R.id === 0 ? '<span class="tagchip">' + q.lec.code + "</span>" : "";
    $("q-meta").innerHTML = lecTag + '<span class="tagchip">' + esc(q.t) + "</span>" + (q.d === 3 ? '<span class="trapchip">Professor trap</span>' : "") + (q.tf !== undefined ? '<span class="tagchip">True / False</span>' : "");
    $("q-text").textContent = q.q;
    const keys = ["1", "2", "3", "4"];
    $("q-opts").innerHTML = it.opts.map((o, i) => '<button class="opt" data-i="' + i + '"><span class="key">' + keys[i] + "</span><span>" + esc(o) + "</span></button>").join("");
    $("q-opts").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => answer(+b.dataset.i)));
    R.t0 = performance.now();
  }

  function answer(i) {
    if (!R || R.locked) return;
    R.locked = true;
    const it = R.items[R.i];
    it.picked = i;
    it.ms = performance.now() - R.t0;
    const ok = i === it.ans;
    it.ok = ok;
    const btns = $("q-opts").querySelectorAll(".opt");
    btns.forEach((b, k) => { b.disabled = true; if (k === it.ans) b.classList.add("is-right"); else if (k === i) b.classList.add("is-wrong"); else b.classList.add("dim"); });

    if (ok) {
      R.score++; R.streak++; R.wrongRun = 0; R.best = Math.max(R.best, R.streak);
      const big = R.streak >= 5 && R.streak % 5 === 0;
      const mid = R.streak === 3 || (R.streak > 3 && R.streak % 3 === 0);
      if (big) { const m = nextMeme("streak"); sfx("streak"); showMeme(m, "good"); }
      else if (mid || Math.random() < 0.3) { const m = nextMeme("right"); sfx("right"); showMeme(m, "good"); }
      else { sfx("right"); }
      $("q-streak").classList.remove("hot"); void $("q-streak").offsetWidth; $("q-streak").classList.add("hot");
    } else {
      R.streak = 0; R.wrongRun++;
      if (R.wrongRun >= 3) { const m = nextMeme("heavy"); sfx("boom"); showMeme(m, "bad"); }
      else { const m = nextMeme("wrong"); sfx("wrong"); showMeme(m, "bad"); }
    }
    $("q-score").textContent = "✓ " + R.score;
    $("q-streak").textContent = "🔥 " + R.streak;
    record(it);
    fillBack(it);
    setTimeout(() => { $("flip").classList.add("flipped"); setTimeout(() => $("b-next").focus({ preventScroll: true }), 350); }, 750);
  }

  function fillBack(it) {
    const ok = it.ok;
    $("b-verdict").className = "verdict " + (ok ? "ok" : "no");
    $("b-verdict").innerHTML = '<span class="big">' + (ok ? "✓ " : "✗ ") + esc(pick(ok ? RIGHT_LINES : WRONG_LINES)) + "</span>";
    let html = '<div class="answer-box"><span class="k">Correct answer</span><span class="v">' + esc(it.opts[it.ans]) + "</span></div>";
    if (!ok) html += '<div class="answer-box yours"><span class="k">You picked</span><span class="v">' + esc(it.opts[it.picked]) + "</span></div>";
    $("b-answers").innerHTML = html;
    $("b-next").textContent = R.i + 1 >= R.items.length ? "See my results →" : "Next card →";
  }

  function record(it) {
    const q = it.q;
    S.total.n++; if (it.ok) S.total.c++;
    const tk = q.lec.code + " · " + q.t;
    const t = (S.topics[tk] = S.topics[tk] || { c: 0, n: 0 });
    t.n++; if (it.ok) t.c++;
    const ls = lecStat(q.lec.id);
    const set = new Set(ls.missed);
    if (it.ok) set.delete(q.id); else set.add(q.id);
    ls.missed = Array.from(set);
    S.bestStreak = Math.max(S.bestStreak, R.streak);
    save();
  }

  function next() {
    if (!R || !$("flip").classList.contains("flipped")) return;
    hideMeme();
    R.i++;
    if (R.i >= R.items.length) return finish();
    renderCard();
    window.scrollTo({ top: 0 });
  }
  $("b-next").addEventListener("click", next);
  $("b-peek").addEventListener("click", () => { $("flip").classList.remove("flipped"); setTimeout(() => $("flip").classList.add("flipped"), 2500); });
  $("quit").addEventListener("click", () => {
    const b = $("quit");
    if (b.dataset.armed) { hideMeme(); R = null; renderHome(); show("home"); return; }
    b.dataset.armed = "1"; b.textContent = "Tap again to quit";
    setTimeout(() => { if (b.dataset.armed) { b.dataset.armed = ""; b.textContent = "✕ Quit"; } }, 2500);
  });

  // ---------- results + analysis ----------
  const TIERS = [
    { min: 90, grade: "Professor-proof", meme: "obama-medal", line: "You'd survive even the meanest exam. Go touch grass, you earned it.", say: "Professor proof. Absolute legend." },
    { min: 75, grade: "Exam ready-ish", meme: "gigachad", line: "Solid. A few gaps left. Patch them and you're cooking.", say: "Exam ready. Almost him." },
    { min: 50, grade: "Mid. Respectfully.", meme: "kombucha-girl", line: "You know the vibes, not the details. The professor grades the details.", say: "Mid. Respectfully." },
    { min: 30, grade: "It's giving retake", meme: "this-is-fine", line: "Not great, not hopeless. Read the cheat sheet for your weakest topics, then run it back.", say: "It's giving retake." },
    { min: 0, grade: "Down bad", meme: "coffin-dance", line: "Rough round. Good news: now you know exactly what to study.", say: "Down bad. But we can fix this." }
  ];
  function finish() {
    const items = R.items;
    const n = items.length, c = items.filter((x) => x.ok).length, acc = pct(c, n);
    const ls = lecStat(R.id);
    ls.rounds++;
    if (!R.mistakesOnly && n >= 20) ls.best = Math.max(ls.best || 0, acc);
    save();

    const keyOf = (q) => (R.id === 0 ? q.lec.code + " · " + q.lec.title : q.t);
    const groups = {};
    items.forEach((x) => { const k = keyOf(x.q); const g = (groups[k] = groups[k] || { c: 0, n: 0 }); g.n++; if (x.ok) g.c++; });
    const rows = Object.entries(groups).map(([k, v]) => ({ k, c: v.c, n: v.n, a: v.c / v.n })).sort((a, b) => a.a - b.a || b.n - a.n);
    const traps = items.filter((x) => x.q.d === 3), normal = items.filter((x) => x.q.d !== 3);
    const trapAcc = pct(traps.filter((x) => x.ok).length, traps.length);
    const normAcc = pct(normal.filter((x) => x.ok).length, normal.length);
    const avg = (arr) => (arr.length ? arr.reduce((s, x) => s + x.ms, 0) / arr.length / 1000 : 0);
    const avgAll = avg(items), avgRight = avg(items.filter((x) => x.ok)), avgWrong = avg(items.filter((x) => !x.ok));
    const readiness = traps.length ? Math.round(acc * 0.6 + trapAcc * 0.4) : acc;
    const tier = TIERS.find((t) => acc >= t.min);

    const advice = [];
    const weak = rows.filter((r) => r.a < 0.8).slice(0, 3);
    if (weak.length) advice.push("Re-read the cheat sheet on <b>" + weak.map((w) => esc(w.k) + " (" + w.c + "/" + w.n + ")").join("</b>, <b>") + "</b>. That's where you're losing points.");
    else advice.push("No weak topic this round. Try the 60-card run or the Final Boss to stress-test it.");
    if (traps.length) {
      if (trapAcc + 15 < normAcc) advice.push("Professor traps got you: " + trapAcc + "% on traps vs " + normAcc + "% on normal cards. Read every word. The trap is usually a swapped number, a swapped country, or 'absolute' vs 'comparative'.");
      else advice.push("You handled the professor traps (" + trapAcc + "%) about as well as the normal cards (" + normAcc + "%). Nice.");
    }
    if (avgWrong && avgRight && avgWrong > avgRight * 1.4) advice.push("You took " + avgWrong.toFixed(1) + "s on wrong answers vs " + avgRight.toFixed(1) + "s on right ones. When you hesitate, you're guessing. Those topics need another look.");
    else if (avgAll < 5) advice.push("Speedrun pace: " + avgAll.toFixed(1) + "s per card. Fast is good, but the traps hide in the wording. Slow down a bit.");
    else advice.push("Average " + avgAll.toFixed(1) + "s per card. Steady pace.");
    if (R.best >= 5) advice.push("Best streak this round: " + R.best + ". Main character energy.");

    const missed = items.filter((x) => !x.ok);
    const trow = (r) => { const p = Math.round(r.a * 100); const cls = p < 50 ? "low" : p < 80 ? "mid" : ""; return '<div class="trow"><span class="name">' + esc(r.k) + '</span><span class="num">' + r.c + "/" + r.n + '</span><div class="bar"><i class="' + cls + '" style="width:' + Math.max(p, 3) + '%"></i></div></div>'; };

    $("res").innerHTML =
      '<div class="res-hero">' +
        '<div class="panel">' +
          '<span class="eyebrow">' + esc(R.id === 0 ? "Final Boss" : R.L.code + " · " + R.L.title) + (R.mistakesOnly ? " · mistakes round" : "") + "</span>" +
          '<div class="scoreline">' + c + "<small> / " + n + " · " + acc + "%</small></div>" +
          '<div class="grade">' + esc(tier.grade) + "</div>" +
          "<p>" + esc(tier.line) + "</p>" +
          '<div class="gauge"><span class="eyebrow">Exam readiness · ' + readiness + '/100</span><div class="gauge-track"><span class="gauge-mark" style="left:' + readiness + '%"></span></div><div class="gauge-labels"><span>cooked</span><span>mid</span><span>ready</span></div></div>' +
          '<div class="res-actions">' +
            (missed.length ? '<button class="btn primary" id="r-miss">Retry my ' + missed.length + " mistake" + (missed.length > 1 ? "s" : "") + "</button>" : "") +
            '<button class="btn" id="r-again">New round</button><button class="btn ghost" id="r-home">All lectures</button>' +
          "</div>" +
        "</div>" +
        '<img class="res-gif" alt="' + esc(tier.grade) + '" src="memes/' + tier.meme + '.gif">' +
      "</div>" +
      '<div class="res-grid">' +
        '<div class="panel"><h3>What the numbers say</h3><div class="kpis">' +
          '<div class="kpi"><span class="k">Accuracy</span><span class="v">' + acc + "%</span></div>" +
          '<div class="kpi"><span class="k">Trap accuracy</span><span class="v">' + (traps.length ? trapAcc + "%" : "–") + "</span></div>" +
          '<div class="kpi"><span class="k">Best streak</span><span class="v">🔥 ' + R.best + "</span></div>" +
          '<div class="kpi"><span class="k">Avg time / card</span><span class="v">' + avgAll.toFixed(1) + "s</span></div>" +
        '</div><div class="advice">' + advice.map((a) => "<p>" + a + "</p>").join("") + "</div></div>" +
        '<div class="panel"><h3>' + (R.id === 0 ? "By lecture" : "By topic") + '</h3><p class="lead">Weakest first. Red under 50%, amber under 80%.</p><div class="topic-list">' + rows.map(trow).join("") + "</div></div>" +
      "</div>" +
      (missed.length
        ? '<div class="panel"><h3>Your mistakes (' + missed.length + ')</h3><p class="lead">Tap one to see the right answer and why.</p><div class="miss-list">' +
          missed.map((x) => '<details class="miss"><summary><span class="x">✗</span><span>' + esc(x.q.q) + '</span></summary><div class="body"><span class="w">' + esc(x.opts[x.picked]) + '</span><span class="r">✓ ' + esc(x.opts[x.ans]) + "</span><span>" + esc(x.q.e) + '</span><span class="hint">' + esc(x.q.lec.code + " · " + x.q.t) + "</span></div></details>").join("") +
          "</div></div>"
        : '<div class="panel"><h3>Zero mistakes</h3><p>Flawless round. Screenshot this and send it to the group chat.</p></div>');

    show("results");
    sfx(acc >= 75 ? "fanfare" : acc < 50 ? "boom" : "right");
   
    const id = R.id, missIds = missed.map((x) => x.q.id), n0 = R.items.length;
    if ($("r-miss")) $("r-miss").addEventListener("click", () => {
      const L = lecById(id);
      const ids = new Set(missIds);
      R = null;
      const qs = shuffle(ALL.filter((q) => ids.has(q.id)));
      R = { id, L, mistakesOnly: true, items: qs.map(buildItem), i: 0, streak: 0, best: 0, wrongRun: 0, score: 0, t0: 0, locked: false };
      $("q-lec").textContent = (id === 0 ? "FINAL BOSS" : L.code + " · " + L.title.toUpperCase()) + " · MISTAKES";
      show("quiz"); renderCard();
    });
    $("r-again").addEventListener("click", () => { renderHome(); openSetup(id); show("home"); });
    $("r-home").addEventListener("click", () => { renderHome(); show("home"); });
  }

  // ---------- keyboard ----------
  document.addEventListener("keydown", (e) => {
    if (!$("scrim").hidden && e.key === "Escape") return closeSetup();
    if ($("quiz").hidden || !R) return;
    const k = e.key;
    if (!R.locked && /^[1-4]$/.test(k)) { const i = +k - 1; if (i < R.items[R.i].opts.length) answer(i); }
    else if (!R.locked && /^[a-dA-D]$/.test(k)) { const i = k.toLowerCase().charCodeAt(0) - 97; if (i < R.items[R.i].opts.length) answer(i); }
    else if ((k === "Enter" || k === " ") && $("flip").classList.contains("flipped")) { e.preventDefault(); next(); }
  });

  function renderHome() { renderGrid(); renderToggles(); }

  renderTicker();
  renderHome();
  const h = (location.hash || "").replace("#", "").toLowerCase();
  const m = /^l([1-6])$/.exec(h);
  if (m) openSetup(+m[1]); else if (h === "boss") openSetup(0);
})();
</script>

</body>
</html>
